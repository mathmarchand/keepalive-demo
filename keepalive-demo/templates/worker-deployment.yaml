apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-worker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-worker
    spec:
      # Fast Eviction: Force K8s to reschedule pod to another node within 10s if node fails
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
      containers:
        - name: worker
          image: "{{ .Values.app.image }}"
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          env:
            - name: APP_MODE
              value: "worker"
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_NAME
              value: {{ .Values.db.database | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: DB_PASS
          # Readiness Probe: Checks if heartbeat file was modified in the last 150 seconds
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os, time, sys; sys.exit(0 if os.path.exists('/tmp/worker_heartbeat') and (time.time() - os.path.getmtime('/tmp/worker_heartbeat')) < 180 else 1)"
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          # Liveness Probe: Restarts container if heartbeat file is missing or older than 300 seconds
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os, time, sys; sys.exit(0 if os.path.exists('/tmp/worker_heartbeat') and (time.time() - os.path.getmtime('/tmp/worker_heartbeat')) < 300 else 1)"
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
