apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.app.image }}"
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          env:
            - name: APP_MODE
              value: "web"
            - name: DB_HOST
              value: "{{ .Release.Name }}-postgresql-ha-pgpool"
            - name: DB_USER
              value: {{ index .Values "postgresql-ha" "postgresql" "username" | quote }}
            - name: DB_PASS
              value: {{ index .Values "postgresql-ha" "postgresql" "password" | quote }}
            - name: DB_NAME
              value: {{ index .Values "postgresql-ha" "postgresql" "database" | quote }}
          ports:
            - containerPort: 8080
