app:
  image: "harbor01.projek-survival.dontexist.com/library/keepalive-demo:1.0.0" 
  imagePullPolicy: IfNotPresent
  
web:
  replicaCount: 3  # Highly Available frontend
  service:
    type: LoadBalancer  # Highly available endpoint via LoadBalancer
    port: 80
    targetPort: 8080

worker:
  replicaCount: 1 # Only 1 replica needed to write exactly once a minute

# Configuration for the Bitnami Highly Available PostgreSQL dependency
postgres:
  image: "postgres:16-alpine"
  database: keepalivedb
  username: myuser
  password: mypassword
  storageClass: "ceph-xfs"
  storageSize: 10Gi
