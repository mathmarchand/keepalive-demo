apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-web-policy
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Release.Name }}-web
  ingress:
    - toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "80"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "^/$"
              # Bundled static assets (Vanilla CSS, Ubuntu fonts, logo)
              - method: "GET"
                path: "^/static/vendor/[A-Za-z0-9._-]+$"
  egress:
    # 1. Allow DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # 2. Allow egress ONLY to Charmed PostgreSQL
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEntities:
        - kube-apiserver
